<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Velocity Blocks: a block-built time-attack racer. Drive, beat the author time, build your own tracks." />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Velocity Blocks</title>
    <!-- Boot screen, styled here so it shows while the scripts and the stylesheet load (a WebView's
         first start after an install can take seconds); it covers the first frames, see main.ts. -->
    <style>
      html,
      body {
        margin: 0;
        background: #0b1020;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b1020;
        color: #9aa6c4;
        font: 600 15px system-ui, sans-serif;
        transition: opacity 0.3s ease-out;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot .logo {
        text-align: center;
        font-weight: 900;
        font-style: italic;
        line-height: 0.95;
        font-size: clamp(40px, 8vw, 84px);
        background: linear-gradient(90deg, #ff6a3d, #ffcf3f 45%, #3fe0ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud" class="hidden">
        <div class="hud-tl">
          <div id="hud-track" class="hud-track"></div>
          <div id="hud-target" class="hud-target"></div>
          <div id="hud-tags" class="hud-tags"></div>
        </div>
        <div class="hud-tr">
          <div id="hud-cp" class="hud-cp"></div>
          <div id="hud-pb" class="hud-pb"></div>
        </div>
        <div id="hud-count" class="hud-count"></div>
        <div id="hud-split" class="hud-split"></div>
        <div id="hud-msg" class="hud-msg" aria-live="polite"></div>
        <div id="hud-flip" class="hud-flip" aria-live="polite"><div id="hud-flip-text"></div><div class="hud-flip-bar"><div id="hud-flip-fill"></div></div></div>
        <div class="hud-bottom">
          <div id="hud-tilt" class="hud-tilt hidden"><span></span></div>
          <div id="hud-time" class="hud-time">0:00.00</div>
        </div>
        <div class="hud-br">
          <div id="hud-speed" class="hud-speed">0</div>
          <div class="hud-unit">km/h</div>
          <div class="hud-boost"><div id="hud-boost-bar"></div></div>
          <div id="hud-nitro" class="hud-nitro n-ready"><span class="n-ring"><span class="n-sec"></span></span><span class="hud-nitro-txt">NITRO <kbd>N</kbd></span></div>
        </div>
      </div>
      <div id="touch" class="hidden steer-buttons pedals-bars">
        <div class="t-pads" data-edge-guard>
          <button class="t-btn t-ctl" data-t="left" aria-label="Steer left">&#9664;</button>
          <button class="t-btn t-ctl" data-t="right" aria-label="Steer right">&#9654;</button>
        </div>
        <div class="t-wheel t-ctl" data-t="wheel" data-edge-guard role="img" aria-label="Steering wheel"><div class="t-wheel-rim"></div></div>
        <div class="t-pedal t-brake t-ctl" data-t="brake" data-edge-guard role="button" aria-label="Brake / reverse">
          <div class="t-track"><div class="t-fill"></div></div><span class="t-pedal-label">BRAKE</span><span class="t-pedal-icon">&#9660;</span>
        </div>
        <div class="t-pedal t-gas t-ctl" data-t="gas" data-edge-guard role="button" aria-label="Accelerate">
          <div class="t-track"><div class="t-fill"></div></div><span class="t-pedal-label">GAS</span><span class="t-pedal-icon">&#9650;</span>
        </div>
        <button class="t-nitro n-ready" data-a="nitro" aria-label="Nitro"><span class="t-nitro-label">N<sub>2</sub>O</span><span class="n-sec"></span></button>
        <div class="t-top">
          <button class="t-small" data-a="respawn" aria-label="Respawn at checkpoint">&#10226; CP</button>
          <button class="t-small" data-a="restart" aria-label="Restart">&#8635; Restart</button>
          <button class="t-small" data-a="pause" aria-label="Pause">&#10074;&#10074;</button>
          <button class="t-small" data-a="camera" aria-label="Change camera">Cam</button>
        </div>
      </div>
      <div id="screens"></div>
      <div id="toast" class="toast"></div>
      <div id="boot" aria-live="polite"><div class="logo">VELOCITY<br />BLOCKS</div><div class="muted">Loading&hellip;</div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
