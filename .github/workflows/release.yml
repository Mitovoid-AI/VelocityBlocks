# Release: push a tag vX.Y.Z (matching package.json "version") and this builds the Android APK and the
# Windows installer + portable .exe on GitHub, attaches them to the GitHub release vX.Y.Z and publishes it,
# with the notes from release-notes/X.Y.Z.md (required: every release has notes; the first 600 characters
# are what the in-app update pop-up shows). See README > "Releasing a new version".
#
# The APK is signed with the keystore in the ANDROID_DEBUG_KEYSTORE_BASE64 secret: the same key as the APKs
# already installed (1.2.x were debug-signed), or the apps could not update. The build stops if the secret is
# missing or the APK's certificate is not APK_CERT_SHA256 below, rather than ship a key that breaks updates.

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release again (e.g. v1.3.0); it must exist'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # SHA-256 of the certificate that signed the released APKs (v1.2.0-v1.2.2). Change it only together
  # with the signing key, knowing that installed apps then need a reinstall.
  APK_CERT_SHA256: 8ab1923630878e38b5edb85af55c5a173fde8675670ead9e43f3a616ce9877d3

jobs:
  check:
    name: Version, notes and tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: v
        name: Tag matches package.json, release notes exist
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (bump it with npm version $version --no-git-tag-version)"
            exit 1
          fi
          notes="release-notes/$version.md"
          if [ ! -s "$notes" ]; then
            echo "::error::$notes is missing or empty: every release needs notes (the first 600 characters are the update pop-up)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  android:
    name: Android APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set: add the keystore that signed the released APKs (see README)"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
      - run: npm ci
      - name: Build the APK (npm run build, cap sync, gradle assembleGithubDebug)
        run: node scripts/release-apk.mjs --debug
      - name: Same key as the installed apps
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$apksigner" verify --print-certs builds/VelocityBlocks.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "APK certificate: $cert"
          if [ "$cert" != "$APK_CERT_SHA256" ]; then
            echo "::error::The APK is signed with $cert, not the released key $APK_CERT_SHA256: installed apps could not update"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: builds/*.apk
          if-no-files-found: error

  windows:
    name: Windows installer and portable
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (type-check, web build, electron-builder)
        run: node scripts/build-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: builds/*.exe
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [check, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          ls -la dist-release
          notes="release-notes/$VERSION.md"
          title="Velocity Blocks $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$notes" --draft=false --latest
          else
            # Full release, never a draft or pre-release: the apps and the website only see the latest one.
            gh release create "$TAG" dist-release/* --verify-tag --title "$title" --notes-file "$notes" --latest
          fi
