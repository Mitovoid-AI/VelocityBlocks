apply plugin: 'com.android.application'

// The app version is set in one place: "version" in package.json (X.Y.Z). versionName is that string and
// versionCode is X*10000 + Y*100 + Z (1.2.0 -> 10200), so every new version gets a larger code. Y and Z
// stay under 100. src/platform/appVersion.ts has the same formula, and tests/appVersion.test.ts checks
// this file still reads it. Google Play already holds versionCode 3 (version 1.2), below any 1.x.y code.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version as String
def appVersionMatch = appVersion =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!appVersionMatch.matches()) throw new GradleException("package.json version must be X.Y.Z, not '${appVersion}'")
def (appMajor, appMinor, appPatch) = (1..3).collect { appVersionMatch.group(it) as int }
if (appMinor > 99 || appPatch > 99) throw new GradleException("package.json version ${appVersion}: minor and patch must be under 100")
def appVersionCode = appMajor * 10000 + appMinor * 100 + appPatch

// Play Store upload key: android/keystore.properties (never committed; see keystore.properties.example).
// Without it, release builds are unsigned and debug builds are unaffected.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

android {
    namespace "com.velocityblocks.game"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.velocityblocks.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // From package.json (see the top of this file): bump "version" there for every release.
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
